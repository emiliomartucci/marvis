# Package metadata for the marvisx-cli console-script.
#
# Scope (S2 F1): the CLI grew from wizard-only into the thin OSS *runtime* —
# `marvis status/brief/project/triage/approve/audit` call the S1 use_cases
# layer in-process (no HTTP, no token). That layer imports `core.api.use_cases`,
# `core.api.db`, `core.api.config`, `core.api.models`, `core.api.routers.projects`
# and parts of `core.api.services`, so the package now ships `core.api*` too.
# Trimming the public mirror down to the minimal importable runtime is S3's job;
# here we only need `marvis status` to run from the installed package.
#
# Local development continues to use the workspace layout (conftest.py at
# repo root puts `.` on sys.path), so existing pytest invocations are
# unaffected.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvisx-cli"
version = "0.3.8b2"
description = "MarvisX OSS — agent-native company-brain CLI runtime (init, status, brief, triage)"
# long_description is sourced from this README (rendered on PyPI). BSL-1.1 is
# source-available; `license` carries the SPDX-style text marker.
readme = "core/cli/README.md"
# Upper bound: the torch-free engine needs onnxruntime, which only ships wheels
# up to CPython 3.13 on some platforms (e.g. macOS-x86_64 has no cp314 wheel yet).
# Capping to <3.14 gives a 3.14 user a clean "needs Python 3.10-3.13" message
# instead of an opaque resolver failure; bump the cap once onnxruntime/tokenizers
# publish cp314 wheels for all platforms. A 3.14 user can still: uv tool install --python 3.13 marvisx-cli
requires-python = ">=3.10,<3.14"
license = { text = "BSL-1.1" }
authors = [{ name = "MarvisX maintainers" }]
keywords = ["marvisx", "cli", "bootstrap", "wizard", "oss", "agent", "company-brain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    # --- CLI surface ---
    "typer>=0.12",
    "rich>=13",
    "click>=8",
    "pydantic>=2.5",
    "pydantic-settings>=2.7.0",       # core.api.config (Settings) loaded by every use_case
    "PyYAML>=6",
    "platformdirs>=4.0",              # core.platform: cross-OS data root (%LOCALAPPDATA% / XDG / Library)
    "cryptography>=42",               # provider-key encryption (per-function LLM config)
    # --- in-process runtime: use_cases call core.api.db / config / models / routers ---
    # `marvis status/brief/project/triage/index` + the single-process MCP server
    # (core.api.mcp.server, FastMCP+stdio) import this layer eagerly. This mirrors
    # requirements-tenant.txt (the model-free "Day-1 API boot" set verified by the
    # tenant Docker smoke) + `mcp`. Heavyweights (torch/onnx/docling/presidio/ocr/
    # remote-embed/phoenix/workos) stay OUT — they are lazy feature backends imported
    # inside functions, not on the runtime entrypoint.
    "fastapi>=0.115.0",
    "slowapi>=0.1.9",                 # core.api.rate_limit + main eager imports
    "cachetools>=5.3.0",
    # The [standard] extra already pulls uvloop with uvicorn's own platform
    # marker (sys_platform != win32/cygwin, non-PyPy) → installed + used on
    # Linux/macOS, skipped on Windows. Do NOT add an unconditional `uvloop`
    # dep here: it overrides that marker and breaks `uv tool install` on
    # Windows (uvloop ships no win32 wheel → RuntimeError). uvicorn falls back
    # to the asyncio loop when uvloop is absent; no code path imports uvloop
    # directly and the OSS CLI never calls uvicorn.run() (pure Typer + stdio MCP).
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.20.0",             # sqlite async driver behind core.api.db
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",        # pydantic EmailStr models
    "defusedxml>=0.7.1",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.18",
    "filelock>=3.16.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "itsdangerous>=2.1.0",
    "pywebpush>=2.0.0",             # core.api.services.push_service (hard import via routers.push)
    "py-vapid>=1.9.0",
    "anthropic>=0.96.0,<1.0.0",     # classifier / LLM config (BYOK gate)
    "openai>=1.50.0,<2.0.0",
    "httpx>=0.28.0",
    "tenacity>=9.1,<10",
    # Knowledge Graph: `marvis project index` parses Python/TS via tree-sitter,
    # walks git history via pygit2, renders markdown via markdown-it-py.
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23.0,<0.25",
    "tree-sitter-typescript~=0.23.2",
    "pygit2>=1.15.0",
    "markdown-it-py>=3.0.0",
    "watchfiles>=1.1.0",            # kg-watcher daemon
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    # The single-process MCP server (FastMCP + stdio).
    "mcp>=1.12",
    # --- default search-by-meaning engine (Granite, no API key) ---
    # Granite is the OSS default semantic engine: it must work on a plain
    # `uv tool install marvisx-cli`, not as an exotic extra. The model ships a
    # pre-exported ONNX graph (onnx/model.onnx), so
    # core.api.services.embedding_internal runs it DIRECTLY via onnxruntime +
    # the Rust `tokenizers` package + huggingface_hub — torch-free. This drops
    # ~1GB of torch/CUDA wheels that sentence-transformers forced as a HARD dep
    # even on the ONNX backend. Inference: onnxruntime (input_ids+attention_mask,
    # int64) -> last_hidden_state -> CLS pooling -> L2-norm. NB: do NOT add
    # `transformers` here — it can pull torch; the Rust `tokenizers` package
    # reproduces the identical tokenization on its own.
    # psutil powers the RAM-floor warning in the client + `marvis doctor`.
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "psutil>=5.9.0",
    # The vec0 loadable SQLite extension that backs the vector index behind
    # `search` (semantic / search-by-meaning). Without it the retriever falls
    # back to keyword and the headline feature fails silently on a clean
    # install. The package ships the platform-correct loadable (.so on Linux,
    # .dylib on macOS) and exposes `sqlite_vec.loadable_path()`, which
    # core.api.config + core.api.db now use to locate vec0.
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# Optional OS keyring backend to source the BYOK master passphrase
# (MARVIS_MASTER_PASSPHRASE) without an env var. NOT a runtime dependency:
# core/wizard/byok_vault.py imports `keyring` defensively and skips it when
# absent (e.g. headless servers), so the vault works without this extra.
keyring = ["keyring>=24"]

[project.scripts]
marvis = "core.cli.marvis_init:main"
marvis-init = "core.cli.marvis_init:main"

[project.urls]
Homepage = "https://justaskmarvis.com"
Documentation = "https://justaskmarvis.com/docs/getting-started"
Source = "https://github.com/emiliomartucci/marvisx-oss"
Issues = "https://github.com/emiliomartucci/marvisx-oss/issues"
Changelog = "https://github.com/emiliomartucci/marvisx-oss/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false
# OSS-runtime modules of the `core/scripts/` namespace (learning fa749d38).
# `core/scripts/` is HALF OSS-runtime (KG populators, ast_parser, frontmatter)
# and HALF internal ops/scanner/customer scripts that MUST NOT ship publicly.
# `packages.find` cannot subset a namespace's modules — it ships the WHOLE dir,
# which would leak the internal scripts. So we ship the vetted OSS allowlist as
# EXPLICIT `py-modules` (each dotted name maps to exactly one file). This is the
# single source of truth alongside `core/scripts/mirror/mirror_filter.sh`
# (`OSS_SCRIPTS_KEEP`): keep the two in sync. NEVER add `core.scripts` /
# `core.scripts*` to packages.find — that is the blanket-ship leak this avoids.
# Closure: frontmatter_validator imports `_frontmatter` at module load (pulled in
# by core.api.main); the KG insert-saga / reindex importlib-loads
# `populate_artifacts` + `populate_cross_project`, which in turn import
# `_graph_writer`; `marvis project index` lazy-imports `ast_parser`.
# `hook` + `populate_knowledge_graph.py` are in OSS_SCRIPTS_KEEP but do not exist
# as files in this tree (legacy allowlist entries); omitted here so py-modules
# only names files that actually ship. Re-add if/when they are restored.
py-modules = [
    "core.scripts.ast_parser",
    "core.scripts._frontmatter",
    "core.scripts._graph_writer",
    "core.scripts.safety_bridge",
    "core.scripts.migrate_spike_node_ids",
    "core.scripts.reparse_failed",
    "core.scripts._drift_check",
    "core.scripts.populate_artifacts",
    "core.scripts.populate_inbox_nodes",
    "core.scripts.populate_pr_impact",
    "core.scripts.populate_project_nodes",
    "core.scripts.populate_cross_project",
    "core.scripts.populate_touch_counter",
]

[tool.setuptools.packages.find]
# `core/` and `projects/` are implicit namespace packages (no __init__.py), so
# discovery must run in namespace mode — otherwise find matches nothing and
# nothing installs. The `core.api.*` subpackages are PEP 420 namespaces too:
# without `namespaces = true` they silently drop out of the wheel (learning
# 9e527cfa: telemetry/api modules missing → hooks fail mute on a clean install).
where = ["."]
include = [
    "core",
    "core.cli*",
    "core.wizard*",
    "core.api*",
    "core.platform*",
    "core.telemetry*",
    "core.scripts.install_hooks",
    "migrations",
    "projects",
    "projects._template*",
]
namespaces = true

[tool.setuptools.package-data]
# IMPORTANT (learning 9e527cfa): an installed wheel that omits these data files
# breaks on a clean machine even though every unit-test stays green (conftest.py
# puts the repo on sys.path, so tests import the SOURCE, not the wheel). The
# globs below are NOT recursive by default — use `**/*` to descend into any
# subfolder. The CI gate (`.github/workflows/pypi-publish.yml`) installs the
# wheel OUTSIDE the repo and greps the archive for these extensions, failing the
# build if any are missing.
#
# Governance hook scripts + the safety_bridge.py rule engine so `marvis hooks
# install` can copy them out of the installed wheel. safety_bridge.py is
# co-located with the .sh wrappers so installed hooks are self-contained.
"core.scripts.install_hooks" = ["*.sh", "**/*.sh", "*.json", "**/*.json", "*.py", "**/*.py"]
# SQL migrations so the installed runtime can bootstrap the schema: core.api.db
# resolves MIGRATIONS_DIR via importlib.resources("migrations") in a wheel, so
# `marvis init` / run_migrations() finds the *.sql there, not just in a checkout.
"migrations" = ["*.sql", "**/*.sql"]
# Markdown agent-soul / identity templates shipped alongside the api package (j2
# kept for forward-compat should any template be migrated to Jinja).
"core.api.templates" = ["*.md", "**/*.md", "*.j2", "**/*.j2"]
# Workflow playbooks (B1): the brain-aware workflow MCP tools load these *.md at
# runtime via importlib-relative path (workflow_playbooks/*.md — the dir is named
# distinctly from the workflows.py module to avoid an import-path collision). Without
# shipping them, `mcp__marvis__plan` raises FileNotFoundError on a clean wheel even
# though tests stay green (conftest puts the source tree on sys.path). `**/*` is
# required to descend into the non-package data subfolders.
"core.api.mcp.tools" = ["*.md", "**/*.md"]
# Project scaffold template read by `marvis project create` via
# importlib.resources("projects._template"); without shipping it the CLI
# silently degrades to a minimal hardcoded seed on an installed wheel.
"projects._template" = ["*.yaml", "**/*.yaml", "*.yml", "**/*.yml", "*.md", "**/*.md"]
# The `marvis guide` reference markdown, loaded via
# importlib.resources("core.cli.guides"); without it the command raises
# FileNotFoundError on a clean wheel even though tests stay green.
"core.cli.guides" = ["*.md", "**/*.md"]
