name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  surface-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Surface registry gate (fail-closed)
        run: python scripts/validate_surfaces.py
      - name: Local GUI perimeter gate (declaration vs source)
        run: python scripts/validate_local_surfaces.py
      - name: Desktop host contract gate (contract vs launcher)
        run: python scripts/validate_desktop_host.py
      - name: Validator unit tests (green on good, red on tampered)
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  # The GUI the public product ships had no job running its tests. The tree
  # arrived from the shared console with 17 failing tests and a suite that did
  # not compile, and nothing said so.
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx vitest run

  console-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the launcher module imports: these tests characterize the
      # CLI entry point, they do not boot the API.
      - run: pip install typer rich pytest
      - name: Console launcher characterization (U7 pre-move baseline)
        run: python -m pytest core/cli/tests -q
