name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One consolidated Python job keeps per-job minute rounding low while the
  # checked collection contract prevents a green result from hiding a suite.
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-contract tests read the exact Plan B base and prove
          # ancestry; a shallow clone turns valid evidence into false RED.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Checked test collection (paths, counts, markers, matrices)
        run: python scripts/verify_ci_collection.py
      - name: Release candidate state (no build or publish)
        run: python scripts/release_candidate.py state
      - name: Required Python suites (zero unexplained skips)
        run: python scripts/run_ci_contract.py
      - name: Immutable 0.3.8 upgrade and rollback
        run: python scripts/verify_local_upgrade.py --download --version 0.3.8
      - name: Public license and audit claims
        run: python scripts/verify_public_claims.py
      - name: Surface registry gate (fail-closed)
        run: python scripts/validate_surfaces.py
      - name: Local GUI perimeter gate (declaration vs source)
        run: python scripts/validate_local_surfaces.py
      - name: Desktop host contract gate (contract vs launcher)
        run: python scripts/validate_desktop_host.py

  # The GUI the public product ships had no job running its tests. The tree
  # arrived from the shared console with 17 failing tests and a suite that did
  # not compile, and nothing said so.
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm run audit:production
      - name: Deterministic build-ID contract
        run: npm run test:build-id
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx vitest run
      - name: Production static build
        env:
          MARVIS_CONSOLE_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_LOCAL_MODE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          test -f out/index.html
          test -d out/_next
