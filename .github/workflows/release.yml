name: Immutable PyPI release

# Pull requests exercise the exact build path without publishing. A version tag
# builds once and promotes that artifact, creates a draft GitHub Release, waits for the protected
# `pypi` environment, then revalidates the 24-hour publication window before
# requesting a short-lived PyPI OIDC token. Nothing is rebuilt after approval.

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "contracts/ci/collection-v1.json"
      - "contracts/release/**"
      - "docs/releases/**"
      - "pyproject.toml"
      - "requirements-release.in"
      - "requirements-release.lock"
      - "scripts/release_candidate.py"
      - "scripts/test_release_candidate.py"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify one immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT: ${{ vars.MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT }}
      MARVIS_APPROVAL_WATCHDOG_RECEIPT: ${{ vars.MARVIS_APPROVAL_WATCHDOG_RECEIPT }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-release.lock

      - name: Install the immutable release gate
        run: pip install --require-hashes -r requirements-release.lock

      - name: Classify the reviewed candidate state
        id: candidate
        run: |
          set -euo pipefail
          status="$(python scripts/release_candidate.py state | python -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate release-only source and immutable inputs
        run: |
          set -euo pipefail
          python scripts/test_release_candidate.py
          if [[ "${{ steps.candidate.outputs.status }}" == "active" && "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/release_candidate.py static --tag-build --trigger-ref "$GITHUB_REF"
          elif [[ "${{ steps.candidate.outputs.status }}" == "active" ]]; then
            python scripts/release_candidate.py static
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "::error::The release candidate is invalidated; only pull-request validation may stop before build."
            exit 1
          fi
          python scripts/validate_surfaces.py
          python scripts/validate_local_surfaces.py
          python scripts/validate_desktop_host.py
          python scripts/verify_public_claims.py

      - name: Run the live pre-tag preflight before the expensive build
        if: ${{ steps.candidate.outputs.status == 'active' && github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifact
          python scripts/release_candidate.py preflight \
            > release-artifact/dispatch-preflight.json

      - name: Recheck the tagged namespace before the expensive build
        if: ${{ steps.candidate.outputs.status == 'active' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifact
          python scripts/release_candidate.py tag-preflight \
            > release-artifact/tag-preflight.json

      - name: Build the local GUI from a digest-pinned image
        if: ${{ steps.candidate.outputs.status == 'active' }}
        run: |
          set -euo pipefail
          desktop_source_sha="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo/apps/desktop-ui \
            -e MARVIS_CONSOLE_BUILD_ID="$desktop_source_sha" \
            -e NEXT_PUBLIC_API_URL="" \
            -e NEXT_PUBLIC_LOCAL_MODE=1 \
            -e NEXT_TELEMETRY_DISABLED=1 \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d \
            bash -lc 'npm ci && npm run test:build-id && npm run audit:production && npm run build'
          test -f apps/desktop-ui/out/index.html
          test -d apps/desktop-ui/out/_next
          rm -rf core/api/console_dist
          mkdir -p core/api/console_dist
          cp -a apps/desktop-ui/out/. core/api/console_dist/

      - name: Fail if a foreign route reached the local artifact
        if: ${{ steps.candidate.outputs.status == 'active' }}
        run: python scripts/validate_local_surfaces.py --bundle core/api/console_dist

      - name: Build one wheel and one source archive
        if: ${{ steps.candidate.outputs.status == 'active' }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p release-artifact/packages
          python -m build --no-isolation --sdist --wheel \
            --outdir release-artifact/packages

      - name: Verify packaged claims, completeness and clean install
        if: ${{ steps.candidate.outputs.status == 'active' }}
        run: |
          set -euo pipefail
          WHEEL="$(find release-artifact/packages -maxdepth 1 -type f -name '*.whl' -print)"
          SDIST="$(find release-artifact/packages -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$WHEEL" && test -n "$SDIST"
          test "$(find release-artifact/packages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          python scripts/verify_public_claims.py --artifact "$WHEEL" --artifact "$SDIST"

          python - "$WHEEL" <<'PY'
          import sys
          import zipfile

          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert sum(name.endswith(".sql") for name in names) >= 50
          assert any(name.endswith("install_hooks/safety_bridge.py") for name in names)
          assert "core/api/console_dist/index.html" in names
          assert any(name.startswith("core/api/console_dist/_next/") for name in names)
          PY

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python -m venv "$WORK/wheel-venv"
          "$WORK/wheel-venv/bin/pip" install --quiet --no-cache-dir "$WHEEL"
          (
            cd "$WORK"
            unset PYTHONPATH
            "$WORK/wheel-venv/bin/marvis" --version
            "$WORK/wheel-venv/bin/marvis" --help >/dev/null
          )

          python -m venv "$WORK/sdist-venv"
          "$WORK/sdist-venv/bin/pip" install --quiet --no-cache-dir \
            --require-hashes -r requirements-release.lock
          "$WORK/sdist-venv/bin/pip" install --quiet --no-cache-dir \
            --no-build-isolation "$SDIST"
          (
            cd "$WORK"
            unset PYTHONPATH
            "$WORK/sdist-venv/bin/marvis" --version
            "$WORK/sdist-venv/bin/marvis" --help >/dev/null
          )

      - name: Create and re-read the immutable artifact manifest
        if: ${{ steps.candidate.outputs.status == 'active' }}
        run: |
          set -euo pipefail
          candidate_version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          cp "docs/releases/${candidate_version}.md" \
            release-artifact/release-notes.md
          manifest_args=(
            --dist release-artifact/packages
            --output release-artifact/release-manifest.json
            --source-sha "$(git rev-parse HEAD)"
          )
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            manifest_args+=(--dispatch-proof release-artifact/tag-preflight.json)
          fi
          python scripts/release_candidate.py manifest "${manifest_args[@]}"
          python scripts/release_candidate.py verify \
            --manifest release-artifact/release-manifest.json \
            --dist release-artifact/packages

      - name: Upload the only candidate artifact
        if: ${{ steps.candidate.outputs.status == 'active' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-release-candidate
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  release-record:
    name: Create a contained draft release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-candidate
          path: release-artifact
      - name: Create a draft and upload only manifested files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            release-artifact/packages/*.whl \
            release-artifact/packages/*.tar.gz \
            release-artifact/release-manifest.json \
            --verify-tag \
            --draft \
            --prerelease \
            --title "$TAG release candidate" \
            --notes-file release-artifact/release-notes.md

  prepublish:
    name: Revalidate before the protected publisher
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, release-record]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT: ${{ vars.MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT }}
      MARVIS_APPROVAL_WATCHDOG_RECEIPT: ${{ vars.MARVIS_APPROVAL_WATCHDOG_RECEIPT }}
    steps:
      - name: Check out the tagged source read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install the hash-closed release verifier
        run: pip install --require-hashes -r requirements-release.lock
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-candidate
          path: release-artifact
      - name: Revalidate all external gates before approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release_candidate.py pretag
          python scripts/release_candidate.py publish-window \
            --manifest release-artifact/release-manifest.json \
            --dist release-artifact/packages

  pypi:
    name: Approve and publish the unchanged candidate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, release-record, prepublish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-candidate
          path: release-artifact
      - name: Minimal post-approval readback without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > release-artifact/run-readback.json
          gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" \
            > release-artifact/environment-readback.json
          remote_tag_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          test "$remote_tag_sha" = "$GITHUB_SHA"
          release_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '[.draft,.prerelease] | @tsv')"
          test "$release_state" = $'true\ttrue'
          python - \
            release-artifact/release-manifest.json \
            release-artifact/run-readback.json \
            release-artifact/environment-readback.json \
            release-artifact/packages <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          manifest_path, run_path, environment_path, packages_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          claimed = manifest.pop("content_digest")
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
          assert claimed == hashlib.sha256(canonical).hexdigest()
          assert manifest["release_source_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["tag"] == os.environ["GITHUB_REF_NAME"]
          assert manifest["dispatch_preflight"]["head_sha"] == os.environ["GITHUB_SHA"]
          receipts = manifest["release_controls"]["external_receipts"]
          assert receipts and set(receipts) == {"trusted_publisher", "approval_watchdog"}
          now = datetime.now(timezone.utc)
          hours = int(manifest["release_controls"]["approval_deadline_hours"])
          for receipt in receipts.values():
              verified = datetime.fromisoformat(receipt["verified_at"].replace("Z", "+00:00"))
              assert 0 <= (now - verified).total_seconds() <= hours * 3600

          run = json.loads(run_path.read_text(encoding="utf-8"))
          assert run["head_sha"] == os.environ["GITHUB_SHA"]
          assert run["event"] == "push"
          assert run["head_branch"] == os.environ["GITHUB_REF_NAME"]
          assert run["path"] == ".github/workflows/release.yml"
          created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          assert 0 <= (now - created).total_seconds() <= hours * 3600

          expected_environment = manifest["release_controls"]["github_environment"]
          environment = json.loads(environment_path.read_text(encoding="utf-8"))
          assert environment["can_admins_bypass"] is expected_environment["can_admins_bypass"]
          assert environment.get("deployment_branch_policy") == expected_environment["deployment_branch_policy"]
          reviewer_rules = [
              rule for rule in environment["protection_rules"]
              if rule.get("type") == "required_reviewers"
          ]
          assert len(reviewer_rules) == 1
          rule = reviewer_rules[0]
          assert rule["prevent_self_review"] is expected_environment["prevent_self_review"]
          logins = {
              item["reviewer"]["login"] for item in rule["reviewers"]
          }
          assert logins == {expected_environment["required_reviewer_login"]}

          expected_files = {row["filename"]: row for row in manifest["artifacts"]}
          observed_files = {path.name: path for path in packages_path.iterdir() if path.is_file()}
          assert set(observed_files) == set(expected_files)
          for name, path in observed_files.items():
              raw = path.read_bytes()
              assert len(raw) == expected_files[name]["size"]
              assert hashlib.sha256(raw).hexdigest() == expected_files[name]["sha256"]
          PY
          if curl --silent --show-error --fail \
            "https://pypi.org/pypi/marvisx-cli/${GITHUB_REF_NAME#v}/json" \
            >/dev/null 2>&1; then
            echo "::error::Candidate version appeared on PyPI before upload."
            exit 1
          fi
      - name: Publish to PyPI with a short-lived identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-artifact/packages/
          skip-existing: false
          verbose: true

  accept:
    name: Verify registry bytes and reversible package upgrade
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT: ${{ vars.MARVIS_PYPI_TRUSTED_PUBLISHER_RECEIPT }}
      MARVIS_APPROVAL_WATCHDOG_RECEIPT: ${{ vars.MARVIS_APPROVAL_WATCHDOG_RECEIPT }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up acceptance Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-candidate
          path: release-artifact
      - name: Re-read PyPI and exercise install, upgrade and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir gh-release-readback
          gh release download "$GITHUB_REF_NAME" --dir gh-release-readback
          cmp release-artifact/release-manifest.json gh-release-readback/release-manifest.json
          python scripts/release_candidate.py verify \
            --manifest gh-release-readback/release-manifest.json \
            --dist gh-release-readback
          python scripts/release_candidate.py registry \
            --manifest release-artifact/release-manifest.json
          python scripts/release_candidate.py registry-download \
            --manifest release-artifact/release-manifest.json \
            --dest pypi-readback
          python scripts/release_candidate.py verify \
            --manifest release-artifact/release-manifest.json \
            --dist pypi-readback

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          smoke_install() {
            local artifact="$1"
            local label="$2"
            local root="$WORK/$label"
            python -m venv "$root/venv"
            local pip="$root/venv/bin/pip"
            local python_bin="$root/venv/bin/python"
            local marvis="$root/venv/bin/marvis"
            if [[ "$artifact" == *.tar.gz ]]; then
              "$pip" install --quiet --require-hashes \
                -r requirements-release.lock
              "$pip" install --quiet --no-build-isolation "$artifact"
            else
              "$pip" install --quiet "$artifact"
            fi

            mkdir -p "$root/vault" "$root/projects" "$root/project"
            (
              export PATH="$root/venv/bin:$PATH"
              export MARVIS_VAULT_DIR="$root/vault"
              export MARVIS_SETTINGS_PATH="$root/vault/settings.yaml"
              export MARVIS_DB_PATH="$root/vault/console.db"
              export MARVIS_PROJECTS_ROOT="$root/projects"
              export MARVIS_TELEMETRY=0
              cd "$root/project"
              git init -q
              "$marvis" --version | grep -q "${GITHUB_REF_NAME#v}"
              "$marvis" --help | grep -q "doctor"
              "$python_bin" -c "import core.api"
              "$marvis" init --accept-bsl --no-interactive --yes \
                --projects-root "$root/projects" \
                --db-backend sqlite \
                --db-path "$root/vault/console.db" \
                --llm-provider skip \
                --project-name "Release Acceptance" \
                --project-slug "release-acceptance" \
                --project-type code \
                --vault-dir "$root/vault"
              "$marvis" doctor --offline
              "$marvis" hooks install
              "$marvis" mcp register
              "$marvis" status --json > "$root/status.json"
              "$marvis" hooks status --json > "$root/hooks.json"
              "$marvis" mcp status --json > "$root/mcp.json"
              "$python_bin" - \
                "$root/status.json" \
                "$root/hooks.json" \
                "$root/mcp.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          status, hooks, mcp = (
              json.loads(Path(path).read_text(encoding="utf-8"))
              for path in sys.argv[1:]
          )
          assert status["db_ok"] is True
          assert hooks["fully_installed"] is True
          assert mcp["connected"] is True
          assert mcp["tool_count"] > 0
          PY
            )

            if [[ "$label" == "wheel" ]]; then
              "$python_bin" "$GITHUB_WORKSPACE/scripts/release_candidate.py" \
                --root "$GITHUB_WORKSPACE" \
                installed-upgrade \
                --version 0.3.8 \
                --evidence-dir "$WORK/recovery-evidence"
            fi
          }

          WHEEL="$(find pypi-readback -maxdepth 1 -type f -name '*.whl' -print)"
          SDIST="$(find pypi-readback -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$WHEEL" && test -n "$SDIST"
          smoke_install "$WHEEL" wheel
          smoke_install "$SDIST" sdist
          python scripts/release_candidate.py acceptance \
            --manifest release-artifact/release-manifest.json \
            --registry-dist pypi-readback \
            --github-dist gh-release-readback \
            --output release-acceptance.json \
            --run-id "$GITHUB_RUN_ID"
      - name: Upload the read-only acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-release-acceptance
          path: release-acceptance.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Publish acceptance evidence and finalize
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, accept]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the acceptance receipt only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-release-acceptance
          path: acceptance
      - name: Publish, read back and finalize the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" acceptance/release-acceptance.json
          mkdir acceptance-readback
          gh release download "$GITHUB_REF_NAME" \
            --pattern release-acceptance.json \
            --dir acceptance-readback
          cmp acceptance/release-acceptance.json \
            acceptance-readback/release-acceptance.json
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=false \
            --latest \
            --title "$GITHUB_REF_NAME"

  contain:
    name: Contain a failed tagged release
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (needs.build.result != 'success' || needs.release-record.result != 'success' || needs.prepublish.result != 'success' || needs.pypi.result != 'success' || needs.accept.result != 'success' || needs.finalize.result != 'success') }}
    needs: [build, release-record, prepublish, pypi, accept, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep any failed release visibly non-final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '[.draft, .prerelease] | @tsv' 2>/dev/null || true)"
          if [[ -z "$release_state" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "$GITHUB_REF_NAME [FAILED - DO NOT INSTALL]" \
              --notes "The tagged release failed before acceptance. The tag and version are burned; use a new version after remediation."
          else
            IFS=$'\t' read -r draft prerelease <<< "$release_state"
            if [[ "$draft" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --draft=true \
                --prerelease=true \
                --title "$GITHUB_REF_NAME [FAILED - DO NOT INSTALL]"
            elif [[ "$prerelease" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --prerelease=true \
                --title "$GITHUB_REF_NAME [FAILED - DO NOT INSTALL]"
            else
              echo "::error::Refusing to mutate an already-final GitHub Release."
              exit 1
            fi
          fi

          version="${GITHUB_REF_NAME#v}"
          if curl --silent --show-error --fail \
            "https://pypi.org/pypi/marvisx-cli/${version}/json" >/dev/null; then
