name: ${COMPOSE_PROJECT_NAME:-marvis-template}

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/_template/Dockerfile.api
    image: marvis-api:${MARVIS_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PIR_DB_PATH: /data/pir/console.db
      DATABASE_URL: sqlite:////data/pir/console.db
      TRUSTED_PROXY_CIDRS: '["127.0.0.1/32","::1/128","${MARVIS_NGINX_IPV4:-172.31.251.20}/32","${MARVIS_CADDY_IPV4:-172.31.251.40}/32"]'
    volumes:
      - sqlite-data:/data/pir
      - workspace-data:/data/workspace
      - runtime-data:/data/runtime
    networks:
      marvis-internal:
        ipv4_address: ${MARVIS_API_IPV4:-172.31.251.10}
    ports:
      - "${API_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  console:
    build:
      context: ../../core/console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8100}
        NEXT_PUBLIC_DIRECT_WS_URL: ${NEXT_PUBLIC_DIRECT_WS_URL:-ws://localhost:8100}
        NEXT_PUBLIC_DIRECT_WS_PROBE_URL: ${NEXT_PUBLIC_DIRECT_WS_PROBE_URL:-http://localhost:8100/health}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_ENABLE_GRAPH_UX: ${NEXT_PUBLIC_ENABLE_GRAPH_UX:-false}
        NEXT_PUBLIC_ENABLE_GRAPH_CANVAS: ${NEXT_PUBLIC_ENABLE_GRAPH_CANVAS:-false}
        NEXT_PUBLIC_ENABLE_GRAPH_UNIVERSE: ${NEXT_PUBLIC_ENABLE_GRAPH_UNIVERSE:-false}
    image: marvis-console:${MARVIS_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    networks:
      marvis-internal:
        ipv4_address: ${MARVIS_CONSOLE_IPV4:-172.31.251.11}
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_started
    environment:
      TRUSTED_CLOUDFLARED_IP: ${MARVIS_CLOUDFLARED_IPV4:-172.31.251.30}
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      marvis-internal:
        ipv4_address: ${MARVIS_NGINX_IPV4:-172.31.251.20}
    ports:
      - "${NGINX_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      marvis-internal:
        ipv4_address: ${MARVIS_CLOUDFLARED_IPV4:-172.31.251.30}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-<<API_KEY>>}

  # Alternative reverse proxy with automatic Let's Encrypt TLS.
  # Activate with `docker compose --profile caddy up -d`.
  # Coexists with nginx baseline (nginx on NGINX_PORT, caddy on 80/443).
  # Set PUBLIC_DOMAIN=localhost in .env for dev (Caddy issues a local cert);
  # set PUBLIC_DOMAIN=example.com + ACME_EMAIL=you@example.com for production.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      MARVIS_API_UPSTREAM: api:8100
      MARVIS_CONSOLE_UPSTREAM: console:3000
    volumes:
      - ./caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      marvis-internal:
        ipv4_address: ${MARVIS_CADDY_IPV4:-172.31.251.40}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlite-data:
  workspace-data:
  runtime-data:
  caddy-data:
  caddy-config:

networks:
  marvis-internal:
    ipam:
      config:
        - subnet: ${MARVIS_NETWORK_SUBNET:-172.31.251.0/24}
