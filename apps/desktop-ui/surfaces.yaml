# Ownership perimeter of the local/desktop GUI owned by marvis.
# U7 of the surface-separation plan (marvisx:docs/goals/2026-07-24-separate-surfaces.md).
#
# Why this file exists: the local/Cloud split used to be a RUNTIME flag
# (NEXT_PUBLIC_LOCAL_MODE) inside one shared Next export. The local product
# navigated five surfaces while the bundle carried every page in the app —
# terminal, hosted administration and SaaS included. Navigation hid them; the
# artifact shipped them. That is KTD10 violated by construction, and the same
# shape as the 2026-07-23 terminal incident: one artifact serving several
# products.
#
# scripts/validate_local_surfaces.py checks this declaration against the real
# source — pages, links, and the import closure that decides what the bundler
# emits — so it cannot drift from the code.
schema_version: 1
surface_id: desktop-ui
owner_project: marvis

# Routes the local product owns. Kept in step with LOCAL_NAV in
# src/components/AppShell.tsx — the gate fails on any drift, in either
# direction.
owned_routes:
  - /diario/
  - /todos/
  - /tasks/
  - /projects/
  - /universe/

# Owned too, but reached from a flow rather than from the navigation bar. They
# must ship: pruning them leaves the UI pointing at pages that do not exist.
# Every entry records the flow that needs it, so this cannot become a backdoor
# for surfaces nobody navigates to.
reachable_routes:
  /settings/llm/: >-
    Recovery path for the missing-LLM-key banner in AppShell. Configuring the
    local model key is part of the local product; without this page the banner
    tells the user to go somewhere that is not shipped.

# Route classes this product must never ship, with the rule each one protects.
# The gate rejects any of these appearing in owned_routes.
forbidden_routes:
  /terminal/: personal terminal Console, owned by marvisx (plan R1/R4)
  /newsletter/: SaaS-only surface, not part of the public local product
  /automations/: SaaS-only surface, not part of the public local product
  /reddit/: SaaS-only surface, not part of the public local product
  /settings/users/: hosted multi-user administration, not local single-user
  /settings/teams/: hosted multi-user administration, not local single-user
  /settings/tokens/: hosted agent-token administration
  /settings/workspace/: hosted workspace administration
  /settings/activity/: hosted activity log
  /settings/general/: hosted workspace settings
  /monitoring/: hosted fleet monitoring
  /finder/: hosted file browser surface
  /brain/: hosted Brain reflection surface
  /inbox/: hosted inbox surface
  /triage/: hosted PR triage surface
  /graph/: hosted Knowledge Graph surface

# Closed and enforced: the export carries the declared routes only, no shipped
# module links outside them, and no module sits in the tree that a route
# cannot reach. Measured, not assumed — see scripts/test_validate_local_surfaces.py.
current_state: perimeter-enforced-on-shipped-code
