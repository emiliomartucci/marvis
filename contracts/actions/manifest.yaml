# Governed action manifest — the shared use-case seam of the marvisx engine.
# U2 artifact 3/3 (separation goal 2026-07-24). Guarded by
# tests/contracts/test_actions_manifest.py: every public callable under
# core/api/use_cases/** must appear here (as an action or under internal), and
# every action must map to a real callable — the manifest cannot rot. And by
# tests/contracts/actions_compat.py: a published id may not disappear between
# the base branch and this one without a declared transition.
#
# PROPOSED, ratified at Triage (same pattern as the #174 profile):
# - naming scheme: marvis.<domain>.<action>, where <action> is the callable
#   name with redundant domain tokens stripped (list_tasks -> list).
# - mutating classification: mechanical derivation — callables prefixed
#   get_/list_/search/check_/counters/preflight/graph_/read_/scan_ are reads,
#   everything else mutates. An entry may contradict the derivation only with a
#   `mutating_override: <reason>` on the same action; the gate reads it.
# - internal: module-level helpers that are not product actions.
# - availability: default matrix below; per-action overrides when a product
#   must not expose an action.
#
# Retiring an id (N/N-1 window, same rule the HTTP contract carries):
#
#   transitions:
#     - id: marvis.tasks.list        # the id leaving
#       replaced_by: marvis.tasks.list_all   # or `none` when nothing replaces it
#       reason: why it moved, in one line
#
# Consumers bind to these ids. Without an entry here, a rename or a removal
# fails the compatibility gate rather than passing green.
schema_version: 1
# Ratified by Emilio at Triage on 2026-08-04 (decision carried from the GitHub
# lineage manifest, PR #183, onto this superset during lineage unification).
status: ratified
availability_default:
  engine-api: available
  cloud: available
  cli-mcp: available
  enterprise: available
  terminal-console: none   # terminal participates only in session/terminal lifecycle (R7)
domains:
  agent_tokens:
    module: core/api/use_cases/agent_tokens.py
    # Token lifecycle is HTTP-only: neither the Python MCP registrar
    # (core/api/mcp/tools/__init__.py) nor the Node MCP (core/mcp-pir) ships
    # a token tool, so the inherited cli-mcp default would advertise four
    # callable actions with no tool behind them. The cli-mcp:none overrides
    # are enforced by tests/contracts/test_actions_manifest.py.
    actions:
      - id: marvis.agent_tokens.create
        callable: create_token
        mutating: true
        availability:
          cli-mcp: none
      - id: marvis.agent_tokens.list
        callable: list_tokens
        mutating: false
        availability:
          cli-mcp: none
      - id: marvis.agent_tokens.revoke
        callable: revoke_token
        mutating: true
        availability:
          cli-mcp: none
      - id: marvis.agent_tokens.acknowledge_rotation
        callable: acknowledge_rotation
        mutating: true
        availability:
          cli-mcp: none
    internal:
      - hash_token
